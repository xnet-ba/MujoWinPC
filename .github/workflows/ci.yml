name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        # default sken hvata sve .sh u repou (scripts/ + tests/)
      - name: bash syntax (fallback)
        run: bash -n scripts/mujowin && bash -n scripts/lib/common.sh && bash -n tests/test_cli.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kopiraj primjer env-a (samo za validaciju sintakse)
        run: cp .env.example .env
      - name: Validiraj sve kombinacije win x profil
        run: |
          for win in 10 11; do
            for prof in lite standard dev heavy; do
              echo "--- win$win + $prof ---"
              WINDOWS_PASSWORD=ci-dummy-16chars docker compose --env-file .env \
                -f compose/base.yml -f compose/win$win.yml -f compose/profile-$prof.yml \
                config >/dev/null
            done
          done

  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - name: HTML validacija (html5validator)
        run: |
          pip install html5validator
          html5validator --root web/ --also-check-css || html5validator --root web/
      - name: Bez eksternih resursa
        run: |
          ! grep -rEo 'https?://[^"'"'"' ]+' web/ | grep -vE 'dockur/windows|github\.com/dockur' \
            && echo "OK: nema eksternih CDN/trackera" || (echo "NAĐEN eksterni URL (osim dozvoljenog linka)"; exit 1)
      - name: bs/en paritet (svaki data-bs mora imati data-en)
        run: |
          python3 - <<'EOF'
          import re, sys
          src = open('web/index.html', encoding='utf-8').read()
          bad = [l for l in src.splitlines() if 'data-bs=' in l and 'data-en=' not in l and 'data-bs-ph' not in l]
          bad += [l for l in src.splitlines() if 'data-bs-ph' in l and 'data-en-ph' not in l]
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('OK: bs/en paritet')
          EOF

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: node --check index.js && node --check mujowin.js && node --check resources.js && node --check boot.js
      - run: node --test ../tests/test_api.mjs

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CLI testovi (mock)
        run: bash tests/test_cli.sh
      - name: Health/idle testovi
        run: bash tests/test_idle.sh

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sken image-a (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dockurr/windows
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"  # ne ruši build dok ne vidimo šta prijavljuje uzvodni image
